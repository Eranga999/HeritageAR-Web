<title id="ft-t">HeritageAR field test at Sigiriya in airplane mode</title>
<desc id="ft-d">Isometric illustration of the Sigiriya rock on a platform with a phone in airplane mode on one side and a crossed-out network tower on the other, showing the app works with no network.</desc>
<style>
.lbl-t{font-weight:600;font-size:14px;fill:#101410}
.lbl-c{font-weight:400;font-size:11.5px;fill:#101410;fill-opacity:.72}
.bob{animation:bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bob2{animation:bob 6s ease-in-out -2s infinite;transform-box:fill-box;transform-origin:center}
.arc{animation:arc 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.arc.a2{animation-delay:-1.07s}.arc.a3{animation-delay:-2.13s}
.ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes arc{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
@keyframes ring{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.arc,.ring{animation:none}.arc{opacity:.5}.ring{opacity:.5}}
</style>
